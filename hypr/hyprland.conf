###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar 
$menu = tofi-drun -c ~/.config/tofi/configA --drun-launch=true
$launcher = rofi -show drun -show-icons
$browser = firefox 
$editor = code

# --enable-features=UseOzonePlatform --ozone-platform=wayland use this flag to launch CEF/Electron apps in wayland

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

#exec-once=/usr/lib/polkit-kde-authentication-agent-1 #Polkit to manage passwords
exec-once = systemctl --user start hyprpolkitagent
exec-once=swaync
exec-once= waybar # topbar
exec-once = awww-daemon # wallpaper
exec-once = awww img ~/.config/assets/backgrounds/mountain-catalina.png  --transition-fps 255 --transition-type outer --transition-duration 0.8
exec-once = wl-paste --type text --watch cliphist store # clipboard
exec-once = wl-paste --type image --watch cliphist store
#exec-once = rm "$HOME/.cache/cliphist/db"   #it'll delete history at every restart    
exec-once = hypridle
exec-once = nm-applet --indicator

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Firefox
env = MOZ_ENABLE_WAYLAND,1

# Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia # remove if firefox crashes
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# QT
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_STYLE_OVERRIDE,kvantum

# Toolkit Backend Variables
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# XDG Specifications
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Screen Presenting Stuff
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgb(8aadf4) rgb(24273A) rgb(24273A) rgb(8aadf4) 45deg
    col.inactive_border = rgb(24273A) rgb(24273A) rgb(24273A) rgb(27273A) 45deg
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
    }

    blur {
        enabled = true
        size = 3
        passes = 2
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us, tr
    #kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0.7
    accel_profile = flat
#    accel_profile = custom 1 0.0 0.4 0.8 1.3 1.9 2.6 3.4 4.3 5.3 6.4
    scroll_factor = 1.0 
    numlock_by_default = true

    touchpad {
    	natural_scroll = true          # Windows-style content-follows-fingers scrolling
        tap-to-click = true
        tap-and-drag = true
        clickfinger_behavior = true      # 2-finger = right click, 3-finger = middle click
        middle_button_emulation = false
    }
}


# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true          # match Windows' virtual-desktop swipe direction
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_min_speed_to_force = 30


    gesture = 4, horizontal, workspace
    gesture = 4, down, mod: ALT, close
    gesture = 4, up, mod: SUPER, scale: 1.5, fullscreen, 1 
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = synps/2-synaptics-touchpad
    accel_profile = custom 1 0.0 0.46 0.92 1.47 2.11 2.84 3.66 4.57 5.57 6.66    
#    accel_profile = flat
    sensitivity = 1
    scroll_factor = 0.09 
}

####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, $notes
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, UP, fullscreen, 1
bind = $mainMod SHIFT, UP, fullscreen 
bind = ALT, F4, killactive,
bind = $mainMod, W, killactive,
bind = $mainMod, A, exec, $launcher
bind = $mainMod, P, exec, hyprctl switchxkblayout all next
bind = $mainMod, N, exec, swaync-client -t -sw     # toggle notification center
bind = $mainMod SHIFT, N, exec, swaync-client -d -sw   # toggle Do Not Disturb
bind = $mainMod, U, exec, kitty --class rmpc-float -e rmpc


bind = SUPER, period, exec, jome -d | wl-copy #Emojipicker + clipboard copy

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move window position with mainMod + SHIFT + arrow keys
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = ALT, Tab, cyclenext

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move/resize windows + Mouse
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Resize windows with mainMod + CTRL + arrow keys
binde = $mainMod+SHIFT, L, resizeactive, 30 0
binde = $mainMod+SHIFT, H, resizeactive, -30 0
binde = $mainMod+SHIFT, K, resizeactive, 0 -30
binde = $mainMod+SHIFT, H, resizeactive, 0 30


# Clipboard
#----------
bind = SUPER, V, exec, cliphist list | tofi -c ~/.config/tofi/configV | cliphist decode | wl-copy

# wipe the whole history
bind = $mainMod SHIFT, V, exec, cliphist wipe

# delete a single entry via the picker
bind = $mainMod CTRL, V, exec, cliphist list | tofi -c ~/.config/tofi/configV | cliphist delete
#-----------------------------------------

# Colour Picker
bind = $mainMod, P, exec, $colorPicker | wl-copy 

# Screen locking
bind = SUPER ALT, L, exec, hyprlock

# wlogout
#bind = CTRL ALT, Delete, exec, wlogout
bind = CTRL ALT, Delete, exec, wlogout -b 5 -c 0 -r 0 -T 330 -B 330 -L 250 -R 250

# waybar
bind = $mainMod SHIFT, W, exec, pkill waybar; waybar &

# Screenshot 
# add --cursor flag to include cursor also, --freeze flag to freeze before selection
bind = , Print, exec, grimblast --notify copysave screen # Entire screen + clipboard copy
bind = SUPER, Print, exec, grimblast --notify copysave active # current Active window only + clipboard copy
bind = SUPER SHIFT, S, exec, grimblast --notify copysave area # Select area to take screenshot

# Volume and Media Control
#bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
#bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s +1%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 1%-

##############################
### WINDOWS AND WORKSPACES ###
##############################

#pavucontrol
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, float on
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, size 700 500
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, center on

#blueman-manager
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(blueman-manager)$, size 600 450
windowrule = match:class ^(blueman-manager)$, center on

#music-player
windowrule = match:class ^(rmpc-float)$, float on
windowrule = match:class ^(rmpc-float)$, size 900 550
windowrule = match:class ^(rmpc-float)$, center on


