# ~/.config/hypr/hyprlock.conf
# Clean, minimal lock screen — background image, clock, simple input field

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/cool.jpg   # <-- point this at your image
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.15
}

# Big centered clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# Date, under the clock
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.75)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# Personal greeting, above the input field — changes with time of day
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/greeting.sh
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Simple minimal input field
input-field {
    monitor =
    size = 260, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = 20

    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgba(255, 255, 255, 1.0)

    fade_on_empty = true
    placeholder_text = <i>Enter password...</i>
    hide_input = false

    position = 0, -120
    halign = center
    valign = center
}
